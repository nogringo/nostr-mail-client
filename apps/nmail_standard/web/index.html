<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Everyone has an email address but nobody owns it. Nostr solves this.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nmail">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">

  <title>Nmail</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    #splash svg {
      width: 120px;
      height: 129px;
    }
    @media (prefers-color-scheme: dark) {
      #splash {
        background: #000;
      }
    }
  </style>
</head>
<body>
  <div id="splash">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="220 200 584 628" aria-hidden="true">
      <defs>
        <linearGradient id="splash-envelope" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#1AA8BE"/>
          <stop offset="1" stop-color="#52DDCB"/>
        </linearGradient>
        <linearGradient id="splash-letter" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#6A3BE4"/>
          <stop offset="1" stop-color="#A57CFF"/>

      </defs>
      <path fill="url(#splash-letter)" d="M573.5 223.2L726.2 350.5A28 28 0 0 1 726.2 393.5L542.7 546.4A48 48 0 0 1 481.3 546.4L297.8 393.5A28 28 0 0 1 297.8 350.5L450.5 223.2A96 96 0 0 1 573.5 223.2Z"/>

    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash').remove(), { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
