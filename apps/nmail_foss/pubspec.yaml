name: nmail_foss
description: "Everyone has an email address but nobody owns it. Nostr solves this."
publish_to: 'none'
version: 0.19.1+32

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  nmail_core: ^0.0.1
  flutter:
    sdk: flutter
  unifiedpush: ^6.2.0
  unifiedpush_ui: ^0.2.0
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  blossom_cache: ^0.5.0
  blossom_upload_queue_shim_for_ndk: ^0.11.0
  broadcast_queue_shim_for_ndk: ^0.8.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  drift: ^2.35.0
  enough_mail_plus: ^2.2.4
  flutter_secure_storage: ^11.2.0
  idb_shim: ^2.9.2
  ndk: ^0.11.0-dev.2
  ndk_flutter: ^0.10.1-dev.1
  nostr_mail: ^7.0.0
  sembast: ^3.8.9+1
  sync_engine_shim_for_ndk: ^0.9.1

flutter_launcher_icons:
  macos:
    generate: true
    image_path: "icons/web/icon-512.png"

flutter:
  uses-material-design: true
  assets:
    - icons/original_transparent_2x.svg
    - icons/original_transparent_3x.png
    - icons/github.svg
    - icons/nostr.svg
