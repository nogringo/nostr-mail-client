name: nmail_foss
description: "Everyone has an email address but nobody owns it. Nostr solves this."
publish_to: 'none'
version: 0.14.0+24

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  nmail_core: ^0.0.1
  flutter:
    sdk: flutter
  get: ^4.7.3
  unifiedpush: ^6.2.0
  unifiedpush_ui: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  macos:
    generate: true
    image_path: "icons/web/icon-512.png"

flutter:
  uses-material-design: true
  assets:
    - icons/original_transparent_2x.svg
    - icons/original_transparent_3x.png
    - icons/github.svg
