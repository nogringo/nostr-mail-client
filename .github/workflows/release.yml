name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: ./.github/actions/inject-nmail-standard-firebase-options
        with:
          firebase-options-base64: ${{ secrets.NMAIL_STANDARD_FIREBASE_OPTIONS_BASE64 }}
          google-services-json-base64: ${{ secrets.NMAIL_STANDARD_GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Validate standard Android Firebase config
        run: test -s apps/nmail_standard/android/app/google-services.json

      - name: Install FOSS dependencies
        run: flutter pub get
        working-directory: apps/nmail_foss

      - name: Install standard dependencies
        run: flutter pub get
        working-directory: apps/nmail_standard

      - name: Prepare Signing
        run: |
          for APP_DIR in apps/nmail_foss apps/nmail_standard; do
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${APP_DIR}/android/app/russel.p12"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > "${APP_DIR}/android/key.properties"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> "${APP_DIR}/android/key.properties"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> "${APP_DIR}/android/key.properties"
            echo "storeFile=russel.p12" >> "${APP_DIR}/android/key.properties"
          done

      - name: Get version from pubspec.yaml files
        id: get_version
        run: |
          FOSS_VERSION=$(grep '^version:' apps/nmail_foss/pubspec.yaml | awk '{print $2}')
          STANDARD_VERSION=$(grep '^version:' apps/nmail_standard/pubspec.yaml | awk '{print $2}')
          if [ "$FOSS_VERSION" != "$STANDARD_VERSION" ]; then
            echo "Version mismatch: nmail_foss=$FOSS_VERSION nmail_standard=$STANDARD_VERSION"
            exit 1
          fi
          VERSION=${FOSS_VERSION%+*}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Android artifact directory
        run: mkdir -p release-artifacts

      - name: Build standard Android APK (universal)
        run: flutter build apk --release
        working-directory: apps/nmail_standard

      - name: Rename standard universal APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_standard/build/app/outputs/flutter-apk/app-release.apk release-artifacts/nmail-${VERSION}-android-universal.apk

      - name: Build standard Android APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
        working-directory: apps/nmail_standard

      - name: Rename standard arm64 APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_standard/build/app/outputs/flutter-apk/app-release.apk release-artifacts/nmail-${VERSION}-android-arm64.apk

      - name: Build standard Android App Bundle
        run: flutter build appbundle --release
        working-directory: apps/nmail_standard

      - name: Rename standard AAB
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_standard/build/app/outputs/bundle/release/app-release.aab release-artifacts/nmail-${VERSION}-android.aab

      - name: Build FOSS Android APK (universal)
        run: flutter build apk --release --flavor foss
        working-directory: apps/nmail_foss

      - name: Rename FOSS universal APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_foss/build/app/outputs/flutter-apk/app-foss-release.apk release-artifacts/nmail-${VERSION}-android-foss-universal.apk

      - name: Build FOSS Android APK (arm64)
        run: flutter build apk --release --flavor foss --target-platform android-arm64
        working-directory: apps/nmail_foss

      - name: Rename FOSS arm64 APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_foss/build/app/outputs/flutter-apk/app-foss-release.apk release-artifacts/nmail-${VERSION}-android-foss-arm64.apk

      - name: Build FOSS Android App Bundle
        run: flutter build appbundle --release --flavor foss
        working-directory: apps/nmail_foss

      - name: Rename FOSS AAB
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_foss/build/app/outputs/bundle/fossRelease/app-foss-release.aab release-artifacts/nmail-${VERSION}-android-foss.aab

      - name: Build ZapStore Android APK (arm64)
        run: flutter build apk --release --flavor zapstore --target-platform android-arm64
        working-directory: apps/nmail_foss

      - name: Rename ZapStore arm64 APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_foss/build/app/outputs/flutter-apk/app-zapstore-release.apk release-artifacts/nmail-${VERSION}-android-zapstore-arm64.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nmail-android
          path: release-artifacts/*

  build-linux:
    runs-on: ubuntu-latest
    env:
      APP_DIR: apps/nmail_standard
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libfuse2 locate
          wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: ./.github/actions/inject-nmail-standard-firebase-options
        with:
          firebase-options-base64: ${{ secrets.NMAIL_STANDARD_FIREBASE_OPTIONS_BASE64 }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=${VERSION%+*}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        working-directory: ${{ env.APP_DIR }}

      - name: Build Linux packages
        run: fastforge package --platform linux --targets deb,appimage
        working-directory: ${{ env.APP_DIR }}

      - name: Rename Linux packages
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          mv dist/**/*.deb dist/nmail-${VERSION}-linux.deb
          mv dist/**/*.AppImage dist/nmail-${VERSION}-linux.AppImage
        working-directory: ${{ env.APP_DIR }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: nmail-deb
          path: ${{ env.APP_DIR }}/dist/*.deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: nmail-appimage
          path: ${{ env.APP_DIR }}/dist/*.AppImage

  build-macos:
    runs-on: macos-latest
    env:
      APP_DIR: apps/nmail_standard
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: ./.github/actions/inject-nmail-standard-firebase-options
        with:
          firebase-options-base64: ${{ secrets.NMAIL_STANDARD_FIREBASE_OPTIONS_BASE64 }}
          macos-google-service-info-plist-base64: ${{ secrets.NMAIL_STANDARD_MACOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Validate macOS Firebase config
        run: test -s ${{ env.APP_DIR }}/macos/Runner/GoogleService-Info.plist

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: |
          dart pub global activate fastforge
          npm install -g appdmg

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=${VERSION%+*}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        working-directory: ${{ env.APP_DIR }}

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/nmail-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Package macOS artifacts
        env:
          APPLE_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          mkdir -p ../../release-artifacts
          fastforge package \
            --no-version-check \
            --platform macos \
            --targets dmg \
            --artifact-name "nmail-${VERSION}-macos" \
            --hook-pre '../../.github/scripts/sign-macos-app.sh "$BUILD_OUTPUT_DIRECTORY/Nmail.app" "macos/Runner/Release.entitlements"'

          DMG_PATH=$(find dist -type f -name '*.dmg' -print -quit)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG produced by Fastforge"
            exit 1
          fi

          cp "$DMG_PATH" "../../release-artifacts/nmail-${VERSION}-macos.dmg"
          ditto \
            -c \
            -k \
            --keepParent \
            build/macos/Build/Products/Release/Nmail.app \
            "../../release-artifacts/nmail-${VERSION}-macos.zip"
        working-directory: ${{ env.APP_DIR }}

      - name: Notarize macOS artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          xcrun notarytool submit "release-artifacts/nmail-${VERSION}-macos.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "release-artifacts/nmail-${VERSION}-macos.dmg"
          xcrun stapler validate "release-artifacts/nmail-${VERSION}-macos.dmg"

          xcrun notarytool submit "release-artifacts/nmail-${VERSION}-macos.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nmail-macos
          path: release-artifacts/nmail-${{ steps.get_version.outputs.version }}-macos.*

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v6

      - name: Extract changelog section
        run: |
          VERSION=${{ needs.build-android.outputs.version }}
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" {flag=1; next}
            /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            echo "Found changelog section for $VERSION"
          else
            echo "No changelog section for $VERSION, falling back to generated notes only"
          fi

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: nmail-android
          path: release-artifacts

      - name: Download .deb
        uses: actions/download-artifact@v8
        with:
          name: nmail-deb
          path: release-artifacts

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: nmail-appimage
          path: release-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: nmail-macos
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
