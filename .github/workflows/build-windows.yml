name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_DIR: apps/nmail_standard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - uses: ./.github/actions/inject-nmail-standard-firebase-options
        with:
          firebase-options-base64: ${{ secrets.NMAIL_STANDARD_FIREBASE_OPTIONS_BASE64 }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install packaging tools
        run: |
          choco install innosetup --no-progress -y
          dart pub global activate fastforge

      - name: Build Windows packages
        run: fastforge package --platform windows --targets exe,zip --artifact-name 'nmail-{{build_name}}-{{platform}}{{#is_installer}}-setup{{/is_installer}}.{{ext}}'
        working-directory: ${{ env.APP_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nmail-windows
          path: |
            ${{ env.APP_DIR }}/dist/**/*.exe
            ${{ env.APP_DIR }}/dist/**/*.zip
