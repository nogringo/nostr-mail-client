name: Build Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      APP_DIR: apps/nmail_foss
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Prepare Signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/russel.p12
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=russel.p12" >> android/key.properties
        working-directory: ${{ env.APP_DIR }}

      - name: Build Android APK
        run: flutter build apk --release --flavor zapstore
        working-directory: ${{ env.APP_DIR }}

      - name: Build Android App Bundle
        run: flutter build appbundle --release --flavor zapstore
        working-directory: ${{ env.APP_DIR }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-zapstore-release.apk build/app/outputs/flutter-apk/nostr-mail-signed.apk
        working-directory: ${{ env.APP_DIR }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nmail-android-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/nostr-mail-signed.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: nmail-android-aab
          path: ${{ env.APP_DIR }}/build/app/outputs/bundle/zapstoreRelease/*.aab
