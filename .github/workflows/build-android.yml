name: Build Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "ndk;$ANDROID_NDK_VERSION"
          NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"

      - uses: ./.github/actions/inject-nmail-standard-firebase-options
        with:
          firebase-options-base64: ${{ secrets.NMAIL_STANDARD_FIREBASE_OPTIONS_BASE64 }}
          google-services-json-base64: ${{ secrets.NMAIL_STANDARD_GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Validate standard Android Firebase config
        run: test -s apps/nmail_standard/android/app/google-services.json

      - name: Install FOSS dependencies
        run: flutter pub get
        working-directory: apps/nmail_foss

      - name: Install standard dependencies
        run: flutter pub get
        working-directory: apps/nmail_standard

      - name: Prepare Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for APP_DIR in apps/nmail_foss apps/nmail_standard; do
            echo "$KEYSTORE_BASE64" | base64 --decode > "${APP_DIR}/android/app/russel.p12"
            echo "storePassword=$KEYSTORE_PASSWORD" > "${APP_DIR}/android/key.properties"
            echo "keyPassword=$KEY_PASSWORD" >> "${APP_DIR}/android/key.properties"
            echo "keyAlias=$KEY_ALIAS" >> "${APP_DIR}/android/key.properties"
            echo "storeFile=russel.p12" >> "${APP_DIR}/android/key.properties"
          done

      - name: Get version from pubspec.yaml files
        id: get_version
        run: |
          FOSS_VERSION=$(grep '^version:' apps/nmail_foss/pubspec.yaml | awk '{print $2}')
          STANDARD_VERSION=$(grep '^version:' apps/nmail_standard/pubspec.yaml | awk '{print $2}')
          if [ "$FOSS_VERSION" != "$STANDARD_VERSION" ]; then
            echo "Version mismatch: nmail_foss=$FOSS_VERSION nmail_standard=$STANDARD_VERSION"
            exit 1
          fi
          VERSION=${FOSS_VERSION%+*}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Android artifact directory
        run: mkdir -p release-artifacts

      - name: Build standard Android APK (universal)
        run: flutter build apk --release
        working-directory: apps/nmail_standard

      - name: Rename standard universal APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_standard/build/app/outputs/flutter-apk/app-release.apk release-artifacts/nmail-${VERSION}-android-universal.apk

      - name: Build standard Android APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
        working-directory: apps/nmail_standard

      - name: Rename standard arm64 APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_standard/build/app/outputs/flutter-apk/app-release.apk release-artifacts/nmail-${VERSION}-android-arm64.apk

      - name: Build standard Android App Bundle
        run: flutter build appbundle --release
        working-directory: apps/nmail_standard

      - name: Rename standard AAB
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_standard/build/app/outputs/bundle/release/app-release.aab release-artifacts/nmail-${VERSION}-android.aab

      - name: Build FOSS Android APK (universal)
        run: flutter build apk --release --flavor foss
        working-directory: apps/nmail_foss

      - name: Rename FOSS universal APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_foss/build/app/outputs/flutter-apk/app-foss-release.apk release-artifacts/nmail-${VERSION}-android-foss-universal.apk

      - name: Build FOSS Android APK (arm64)
        run: flutter build apk --release --flavor foss --target-platform android-arm64
        working-directory: apps/nmail_foss

      - name: Rename FOSS arm64 APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_foss/build/app/outputs/flutter-apk/app-foss-release.apk release-artifacts/nmail-${VERSION}-android-foss-arm64.apk

      - name: Build FOSS Android App Bundle
        run: flutter build appbundle --release --flavor foss
        working-directory: apps/nmail_foss

      - name: Rename FOSS AAB
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_foss/build/app/outputs/bundle/fossRelease/app-foss-release.aab release-artifacts/nmail-${VERSION}-android-foss.aab

      - name: Build ZapStore Android APK (arm64)
        run: flutter build apk --release --flavor zapstore --target-platform android-arm64
        working-directory: apps/nmail_foss

      - name: Rename ZapStore arm64 APK
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          cp apps/nmail_foss/build/app/outputs/flutter-apk/app-zapstore-release.apk release-artifacts/nmail-${VERSION}-android-zapstore-arm64.apk

      - name: Verify Android 16 KB alignment
        run: scripts/check_android_16kb_alignment.sh release-artifacts/*.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nmail-android
          path: release-artifacts/*
